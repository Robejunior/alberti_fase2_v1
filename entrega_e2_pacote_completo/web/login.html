<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIA · Entrar</title><link rel="stylesheet" href="/style.css"><script defer src="/login.js"></script></head>
<body class="login-body">
<main class="login-card">
<div class="panel">
<div class="eyebrow">PROJETO INTEGRADOR · E2</div>
<h2>Entrar no painel TIA</h2>
<p>Informe o usuário e a senha fornecidos para acessar o Projeto Integrador de IA em Saúde.</p>
<form id="login-form">
<label for="usuario">Usuário</label>
<input id="usuario" name="usuario" autocomplete="username" required>
<label for="senha">Senha</label>
<input id="senha" name="senha" type="password" autocomplete="current-password" required>
<button type="submit" class="primary">Entrar</button>
<p id="login-status" role="status" aria-live="polite"></p>
</form>
</div>
</main>
</body></html>
